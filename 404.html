    (function () {
      var dock = document.getElementById("sunnyDock");
      function place() {
        var s = window.Sunny && Sunny.el;
        if (!s || !dock) return false;
        var r = dock.getBoundingClientRect();
        s.style.left = Math.round(r.left + window.scrollX + (r.width - 150) / 2) + "px";
        s.style.top = Math.round(r.top + window.scrollY + r.height - 150) + "px";
        return true;
      }
      var tries = 0, t = setInterval(function () { if (place() || ++tries > 40) clearInterval(t); }, 50);

      var lines = ["I checked under the rug. Nothing.", "404. Not my fault. Probably.", "The map is upside down, isn't it?", "Lost together is still together."];

        if (!window.Sunny || !Sunny.el) return;

        Sunny.say(lines[Math.floor(Math.random() * lines.length)], 3600);
      }, 2400);
    })();
